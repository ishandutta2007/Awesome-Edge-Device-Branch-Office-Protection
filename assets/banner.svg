<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashAnim {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes signalSweep {
        0% { transform: translateX(0); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateX(500px); opacity: 0.1; }
      }
      .ambient-glow-1 {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: 200px 150px;
      }
      .ambient-glow-2 {
        animation: pulseGlow 8s ease-in-out infinite alternate-reverse;
        transform-origin: 1000px 250px;
      }
      .floating-diag {
        animation: floatNode 5s ease-in-out infinite alternate;
      }
      .pulse-line {
        stroke-dasharray: 8 6;
        animation: dashAnim 20s linear infinite;
      }
      .data-packet {
        animation: signalSweep 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="140" r="180" fill="url(#glowGrad1)" class="ambient-glow-1" />
  <circle cx="1020" cy="260" r="220" fill="url(#glowGrad2)" class="ambient-glow-2" />

  <!-- Dynamic Network Connection Lines in Background -->
  <g opacity="0.35" class="floating-diag">
    <path d="M 150 360 L 350 360 L 550 380 L 800 360 L 1050 360" fill="none" stroke="#0284c7" stroke-width="2" class="pulse-line" />
    <path d="M 850 70 L 980 130 L 1100 80" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 5" />
    <path d="M 980 130 L 980 280" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <!-- Edge Node Devices Icons in Background -->
    <g transform="translate(930, 240)">
      <rect width="100" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" fill-opacity="0.8" />
      <circle cx="20" cy="30" r="5" fill="#22c55e" />
      <line x1="35" y1="25" x2="85" y2="25" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="35" y1="35" x2="70" y2="35" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    </g>

    <g transform="translate(1050, 110)">
      <rect width="80" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" fill-opacity="0.8" />
      <circle cx="16" cy="25" r="4" fill="#38bdf8" />
      <line x1="28" y1="20" x2="68" y2="20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="28" y1="30" x2="55" y2="30" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Cloud Shield Hub in Background -->
    <g transform="translate(810, 40)">
      <path d="M 40 10 Q 55 10 65 20 Q 75 15 85 25 Q 95 35 90 50 Q 90 60 80 65 L 20 65 Q 5 65 5 50 Q 5 35 15 25 Q 20 10 40 10 Z" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    </g>
  </g>

  <!-- Foreground Content: Unobstructed, High Contrast -->
  <g transform="translate(70, 75)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="365" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bae6fd" letter-spacing="1">CURATED PRODUCTION PLAYBOOK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#brandGrad)" letter-spacing="-0.5">
      Edge Device &amp; Branch Office Protection
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#f8fafc">
      Resilient ROBO Backup, Endpoint Bare-Metal Recovery &amp; Distributed Edge Security
    </text>

    <!-- Tagline description -->
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      Architected for zero-IT remote sites, low-bandwidth branches, retail POS, and distributed edge nodes.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="85" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">🛡️ ROBO Disaster Recovery</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(182, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="90" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">⚡ Bare-Metal Image Restore</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(374, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="90" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">🔒 Immutable Cloud Repos</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(566, 0)">
        <rect width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="87" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">🌐 Edge Computing Nodes</text>
      </g>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="419" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4" rx="10" />
</svg>